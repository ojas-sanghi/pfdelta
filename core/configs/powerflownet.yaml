functional:
  _checkpoint_used: true
  checkpoint: true
  config: powerflownet
  cpu: false
  deterministic: false
  is_debug: false
  run_location: runs/gen_apr0326/pbl/task34/powerflownet//case57_118_500/seed=44_case=case57_118_500_lr=1e-4_9_260406_053913
  run_name: \case57_118_500/seed=44_case=case57_118_500_lr=1e-4_9_260406_053913
  seed: 44
  slurm_jobid:
  - '11450860'
  trainer_name: gnn_trainer
model:
  K: 3
  dropout_rate: 0.2
  efeature_dim: 5
  hidden_dim: 256
  n_gnn_layers: 4
  name: powerflownet
  nfeature_dim: 6
  output_dim: 6
optim:
  optimizer:
    lr: 0.0001
    name: Adam
    weight_decay: 0.0
  train_params:
    batch_size: 64
    epochs: 100
    train_loss:
    - model: PFNet
      name: universal_power_balance
    - name: GNNTorchLoss
      output_name: bus__y
      torch_nn_name: MSELoss
    - name: pfn_masked_mse
      regularize: false
    - name: pfn_masked_mse
      regularize: true
    - keyword: pbl_pf
      loss_name: PBL Max
      name: recycle_loss
      recycled_parameter: power_balance_max
    - keyword: pbl_pf
      loss_name: PBL L2
      name: recycle_loss
      recycled_parameter: power_balance_l2
  val_params:
    batch_size: 64
    early_stop:
      decrease_by: 0.01
      decrease_for: 10
      needs_best_every: 15
    report_every: 2
    val_loss:
    - model: PFNet
      name: universal_power_balance
    - name: GNNTorchLoss
      output_name: bus__y
      torch_nn_name: MSELoss
    - name: pfn_masked_mse
      regularize: false
    - name: pfn_masked_mse
      regularize: true
    - keyword: pbl_pf
      loss_name: PBL Max
      name: recycle_loss
      recycled_parameter: power_balance_max
    - keyword: pbl_pf
      loss_name: PBL L2
      name: recycle_loss
      recycled_parameter: power_balance_l2

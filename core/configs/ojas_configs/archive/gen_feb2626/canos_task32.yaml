config_type: simple_batch
job_parameters:
  time: "144:00:00"
  p: "cpu-gpu-v100"
  gpus: 1
  body: "uv run __launch__"
batch_name: gen_feb2626_canos_task32
dataset:
  datasets:
  - add_bus_type: true
    case_name: case14_30_57
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /mnt/home/donti-group-shared/pfdelta_data
    split: train
    task: 3.2
  - add_bus_type: true
    case_name: case14_30_57
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /mnt/home/donti-group-shared/pfdelta_data
    split: val
    task: 3.2



  - add_bus_type: true
    case_name: case14
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /mnt/home/donti-group-shared/pfdelta_data
    split: val
    task: 1.3

  - add_bus_type: true
    case_name: case30
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /mnt/home/donti-group-shared/pfdelta_data
    split: val
    task: 1.3

  - add_bus_type: true
    case_name: case57
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /mnt/home/donti-group-shared/pfdelta_data
    split: val
    task: 1.3

  - add_bus_type: true
    case_name: case118
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /mnt/home/donti-group-shared/pfdelta_data
    split: val
    task: 1.3

  - add_bus_type: true
    case_name: case500
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /mnt/home/donti-group-shared/pfdelta_data
    split: val
    task: 1.3
  
functional:
  cpu: true
  is_debug: false
  run_location: gen_feb2626/task32/canos
  run_name: seed=%seed_lr=%lr_hidden=%hidden_dim_steps=%k_steps
  seed: _manual_list(42, 43, 44)
  trainer_name: gnn_trainer
model:
  dataset: _include_
  hidden_dim: _manual_list(128)
  include_sent_messages: true
  k_steps: _manual_list(15)
  name: canos_pf
optim:
  lr_scheduler:
    milestones:
    - 5
    name: SequentialLR
    schedulers:
    - end_factor: 1
      name: LinearLR
      start_factor: 0.01
    - gamma: 0.9
      name: StepLR
      step_size: 4
  optimizer:
    lr: _manual_list(0.0005)
    name: Adam
    weight_decay: 0.0
  train_params:
    batch_size: 64
    epochs: 50
    train_loss:
    - lamb: 0.1
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - model: CANOS
      name: universal_power_balance
  val_params:
    batch_size: 64
    early_stop:
      decrease_by: 0.01
      decrease_for: 10
      needs_best_every: 15
    report_every: 2
    val_loss:
    - lamb: 0.1
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - model: CANOS
      name: universal_power_balance
config_type: simple_batch
job_parameters:
  p: mit_normal_gpu,mit_preemptable
  exclude: node1928,node4007
  requeue: __novalue__
  body: "source ~/.bashrc\nuv run __launch__"
  mem: 64G
  G: 1
  output: canos_pbl_%j.out
  signal: USR1@90
  time: "05:59:00"
batch_name: gen_pbl_apr0326_canos_task33
dataset:
  datasets:
  - add_bus_type: true
    case_name: case118_500
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: train
    task: 3.3
  - add_bus_type: true
    case_name: case118_500
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 3.3



  - add_bus_type: true
    case_name: case14
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3

  - add_bus_type: true
    case_name: case30
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3

  - add_bus_type: true
    case_name: case57
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3

  - add_bus_type: true
    case_name: case118
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3

  - add_bus_type: true
    case_name: case500
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
  
functional:
  cpu: false
  checkpoint: True
  is_debug: false
  run_location: gen_pbl_apr0326/task33/canos
  run_name: seed=%seed_lr=%lr_hidden=%hidden_dim_steps=%k_steps
  seed: _manual_list(42, 43, 44)
  trainer_name: gnn_trainer
model:
  dataset: _include_
  hidden_dim: _manual_list(256)
  include_sent_messages: true
  k_steps: _manual_list(15)
  name: canos_pf
optim:
  lr_scheduler:
    milestones:
    - 5
    name: SequentialLR
    schedulers:
    - end_factor: 1
      name: LinearLR
      start_factor: 0.01
    - gamma: 0.9
      name: StepLR
      step_size: 4
  optimizer:
    lr: _manual_list(0.0005 | 0.0005)
    name: Adam
    weight_decay: 0.0
  train_params:
    batch_size: 64
    epochs: 200
    train_loss:
    - model: CANOS
      name: universal_power_balance
    - lamb: 0.1
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - lamb: 0
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - lamb: 0.5
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - lamb: 1
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - keyword: pbl_pf
      loss_name: PBL Max
      name: recycle_loss
      recycled_parameter: power_balance_max

  val_params:
    batch_size: 64
    early_stop:
      decrease_by: 0.01
      decrease_for: 10
      needs_best_every: 15
    report_every: 2
    val_loss:
    - model: CANOS
      name: universal_power_balance
    - lamb: 0.1
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - lamb: 0
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - lamb: 0.5
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - lamb: 1
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - keyword: pbl_pf
      loss_name: PBL Max
      name: recycle_loss
      recycled_parameter: power_balance_max
config_type: experiment
dataset:
  datasets:
  - add_bus_type: false
    case_name: case14_30_57
    model: PFNet
    name: pfdeltaPFNet
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: train
    task: 3.2
    transform:
    - name: branch_perturbation
      sigma: 0.03
    - pfnet_data_mean0_var1
  - add_bus_type: false
    case_name: case14_30_57
    model: PFNet
    name: pfdeltaPFNet
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 3.2
    transform: pfnet_data_mean0_var1
  - add_bus_type: false
    case_name: case14
    model: PFNet
    name: pfdeltaPFNet
    normalized_case_name: case14_30_57
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
    transform: pfnet_data_mean0_var1
  - add_bus_type: false
    case_name: case30
    model: PFNet
    name: pfdeltaPFNet
    normalized_case_name: case14_30_57
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
    transform: pfnet_data_mean0_var1
  - add_bus_type: false
    case_name: case57
    model: PFNet
    name: pfdeltaPFNet
    normalized_case_name: case14_30_57
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
    transform: pfnet_data_mean0_var1
  - add_bus_type: false
    case_name: case118
    model: PFNet
    name: pfdeltaPFNet
    normalized_case_name: case14_30_57
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
    transform: pfnet_data_mean0_var1
  - add_bus_type: false
    case_name: case500
    model: PFNet
    name: pfdeltaPFNet
    normalized_case_name: case14_30_57
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
    transform: pfnet_data_mean0_var1
functional:
  checkpoint: true
  config: graph_conv
  cpu: false
  deterministic: false
  is_debug: false
  run_location: gen_apr1126_perturb/pbl/task32/graphconv
  run_name: seed=42_lr=1e-4_hidden=256_layers=10_0
  seed: 42
  trainer_name: gnn_trainer
model:
  hidden_dim: 256
  in_dim: 6
  n_layers: 10
  name: graph_conv
  out_dim: 6
optim:
  optimizer:
    lr: 0.0001
    name: Adam
    weight_decay: 0.0
  train_params:
    batch_size: 64
    epochs: 150
    train_loss:
    - model: PFNet
      name: universal_power_balance
    - name: GNNTorchLoss
      output_name: bus__y
      torch_nn_name: MSELoss
    - name: pfn_masked_mse
      regularize: false
    - name: pfn_masked_mse
      regularize: true
    - keyword: pbl_pf
      loss_name: PBL Max
      name: recycle_loss
      recycled_parameter: power_balance_max
    - keyword: pbl_pf
      loss_name: PBL L2
      name: recycle_loss
      recycled_parameter: power_balance_l2
  val_params:
    batch_size: 64
    early_stop:
      decrease_by: 0.01
      decrease_for: 10
      needs_best_every: 15
    report_every: 2
    val_loss:
    - model: PFNet
      name: universal_power_balance
    - name: GNNTorchLoss
      output_name: bus__y
      torch_nn_name: MSELoss
    - name: pfn_masked_mse
      regularize: false
    - name: pfn_masked_mse
      regularize: true
    - keyword: pbl_pf
      loss_name: PBL Max
      name: recycle_loss
      recycled_parameter: power_balance_max
    - keyword: pbl_pf
      loss_name: PBL L2
      name: recycle_loss
      recycled_parameter: power_balance_l2

  optimizer:
    lr: 0.0005
    name: Adam
    weight_decay: 0.0
  train_params:
    batch_size: 64
    epochs: 200
    train_loss:
    - model: CANOS
      name: universal_power_balance
    - lamb: 0.1
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - lamb: 0
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss

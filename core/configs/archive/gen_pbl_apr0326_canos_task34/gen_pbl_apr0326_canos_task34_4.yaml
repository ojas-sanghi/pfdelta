functional:
  _checkpoint_used: true
  checkpoint: true
  config: gen_pbl_apr0326_canos_task34/gen_pbl_apr0326_canos_task34_4
  cpu: false
  deterministic: false
  is_debug: false
  run_location: runs/gen_pbl_apr0326/task34/canos/case30_57_118/seed=43_case=case30_57_118_lr=0.0005_hidden=256_steps=15_4_260404_185238

  slurm_jobid:
  - '11394622'
  trainer_name: gnn_trainer
model:
  dataset: _include_
  hidden_dim: 256
  include_sent_messages: true
  k_steps: 15
  name: canos_pf
optim:
  lr_scheduler:
    milestones:
    - 5
    name: SequentialLR
    schedulers:
    - end_factor: 1

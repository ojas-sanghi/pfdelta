      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - lamb: 1
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - keyword: pbl_pf
      loss_name: PBL Max
      name: recycle_loss
      recycled_parameter: power_balance_max
  val_params:
    batch_size: 64
    early_stop:
      decrease_by: 0.01
      decrease_for: 10
      needs_best_every: 15
    report_every: 2
    val_loss:
    - model: CANOS
      name: universal_power_balance
    - lamb: 0.1
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - lamb: 0
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - lamb: 0.5
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - lamb: 1
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - keyword: pbl_pf
      loss_name: PBL Max
      name: recycle_loss

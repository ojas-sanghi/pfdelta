functional:
  _checkpoint_used: true
  checkpoint: true
  config: gen_mse_apr1126_perturb_canos_task33/gen_mse_apr1126_perturb_canos_task33_0
  cpu: false
  deterministic: false
  is_debug: false
  run_location: runs/gen_apr1126_perturb/mse/task33/canos/seed=42_lr=0.0005_hidden=128_steps=20_0_260416_033041
  run_name: seed=42_lr=0.0005_hidden=128_steps=20_0_260416_033041
  seed: 42
  slurm_jobid:
  - '11980781'
  trainer_name: gnn_trainer
model:
  dataset: _include_
  hidden_dim: 128
  include_sent_messages: true
  k_steps: 20
  name: canos_pf
optim:
  lr_scheduler:
    milestones:
    - 5
    name: SequentialLR
    schedulers:
    - end_factor: 1
      name: LinearLR
      start_factor: 0.01
    - gamma: 0.9
      name: StepLR
      step_size: 4
  optimizer:
    lr: 0.0005
    name: Adam
    weight_decay: 0.0
  train_params:
    batch_size: 64
    epochs: 200
    train_loss:
    - lamb: 0.1
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - model: CANOS
      name: universal_power_balance
    - lamb: 0
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - lamb: 0.5
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - lamb: 1
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - keyword: pbl_pf
      loss_name: PBL Max
      name: recycle_loss
      recycled_parameter: power_balance_max
  val_params:
    batch_size: 64
    early_stop:
      decrease_by: 0.01
      decrease_for: 10
      needs_best_every: 15
    report_every: 2
    val_loss:
    - lamb: 0.1
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - model: CANOS
      name: universal_power_balance
    - lamb: 0
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - lamb: 0.5
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - lamb: 1
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    - keyword: pbl_pf
      loss_name: PBL Max
      name: recycle_loss
      recycled_parameter: power_balance_max
